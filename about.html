<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="关于体验设计师常宸。"><title>关于 · CyrusChang</title><link rel="stylesheet" href="styles.css"></head><body><main class="page prose-page"><a class="back" href="index.html">← <span>首页</span></a><header class="about-header"><img class="about-avatar" src="assets/cyrus-avatar.jpg" alt="常宸"><div><p class="eyebrow">关于我</p><h1>常宸 / CyrusChang</h1></div></header><p class="lead">一名在北京/成都工作的体验设计师。目前主要处理游戏里的复杂系统交互，也在用 AI 和代码拓展设计能够抵达的地方。</p><section><h2>我在做什么</h2><p>把规则、状态、信息层级和反馈方式理顺，让玩家知道自己在哪、可以做什么，以及接下来会发生什么。</p></section><section><h2>我关心什么</h2><p>游戏 UX、AI 交互、可验证的设计原型，以及设计师如何把零散判断沉淀为可以复用的工作方式。</p></section><section><h2>我的工作方式</h2><p>先从真实任务和证据出发，再做设计取舍；能用原型验证的，就尽量让它早点被点击和使用。</p></section></main><script src="script.js"></script></body></html>
