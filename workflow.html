<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="常宸使用 Obsidian 整理设计证据与判断的工作流。"><title>Obsidian 工作流 · CyrusChang</title><link rel="stylesheet" href="styles.css"></head><body><main class="page prose-page"><a class="back" href="index.html">← <span>首页</span></a><header><p class="eyebrow">工作方式</p><h1>把零散材料，整理成可以追溯的设计判断。</h1><p class="lead">Obsidian 对我来说不是收藏夹。项目资料、录屏观察、研究摘要和设计决策需要互相连接，后来的判断也要能回到最初的证据。</p></header><section><h2>来源</h2><p>需求说明、竞品录屏、玩家反馈、研究文章和会议记录先保留原貌，避免摘要覆盖原始信息。</p></section><section><h2>整理</h2><p>把材料转成项目、概念、来源摘要与综合分析。每个结论标明来源，事实、候选方案和待验证内容分开。</p></section><section><h2>回到设计</h2><p>整理结果最终要进入流程、状态、信息结构、交互文档或可点击 Demo。知识库的价值，体现在下一次设计判断更快、更有依据。</p></section></main><script src="script.js"></script></body></html>
